{{ define "base" }}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }}</title>

    <link rel="stylesheet"
          href="/static/css/style.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <div class="site">

        <!-- =========================
             Navigation
             ========================= -->

        <header class="site-header">

            <nav class="main-nav">

                <!-- Logo -->

                <a href="/" class="nav-logo">
                    KT
                </a>


                <!-- Navigation -->

                <div class="nav-links">

                    <a href="/"
                       class="{{ if eq .ActivePage "home" }}active{{ end }}">

                        <i class="bi bi-house-door-fill"></i>

                        <span>Home</span>

                    </a>


                    <a href="/about"
                       class="{{ if eq .ActivePage "about" }}active{{ end }}">

                        <i class="bi bi-person"></i>

                        <span>About Me</span>

                    </a>


                    <a href="/education"
                       class="{{ if eq .ActivePage "education" }}active{{ end }}">

                        <i class="bi bi-mortarboard"></i>

                        <span>Education</span>

                    </a>


                    <a href="/experience"
                       class="{{ if eq .ActivePage "experience" }}active{{ end }}">

                        <i class="bi bi-briefcase"></i>

                        <span>Work Experience</span>

                    </a>

                    <a href="/projects"
                       class="{{ if eq .ActivePage "projects" }}active{{ end }}">

                        <i class="bi bi-grid"></i>

                        <span>Projects</span>

                    </a>

                    <a href="/skills"
                       class="{{ if eq .ActivePage "skills" }}active{{ end }}">

                        <i class="bi bi-code-slash"></i>

                        <span>Skills</span>

                    </a>

                </div>

            </nav>

        </header>


        <!-- =========================
             Page Content
             ========================= -->

        <main class="page-content">

            {{ template "content" . }}

        </main>

    </div>

</body>

</html>

{{ end }}
