{{ define "base" }}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="hero">

        <!-- LEFT -->
        <section class="hero-left">

            <a href="/" class="home-link {{ if eq .ActivePage "home" }}active{{ end }}">
                <i class="bi bi-house-door-fill"></i> Home
            </a>

            {{ template "content" . }}

        </section>


        <!-- RIGHT -->
        <section class="hero-right">

    <nav>

        <a href="/about"
           class="{{ if eq .ActivePage "about" }}active{{ end }}">
            About me
        </a>

        <a href="/education"
           class="{{ if eq .ActivePage "education" }}active{{ end }}">
            Education
        </a>

        <a href="/experience"
           class="{{ if eq .ActivePage "experience" }}active{{ end }}">
            Work Experience
        </a>

        <a href="/projects"
           class="{{ if eq .ActivePage "projects" }}active{{ end }}">
            Projects
        </a>

        <a href="/skills"
           class="{{ if eq .ActivePage "skills" }}active{{ end }}">
            Skills
        </a>

    </nav>

    {{ template "right-content" . }}

</section>

    </div>

</body>

</html>

{{ end }}
